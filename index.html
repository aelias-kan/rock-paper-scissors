<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>rock-paper-scissors</title>
</head>
<body>
    <div class="header">
        <h1>Rock Paper Scissors Game</h1>
    </div>
    <div class="main"> 
        <div class="rock">
            <img width="220px" height="220px" src="images/Rock.jpg">
            <p>Rock</p>
        </div>
        <div class="paper">
            <img width="200px" height="200px" src="images/paper.jpeg">
            <p>Paper</p>
        </div>
        <div class="scissor">
            <img width="220px" height="220px" src="images/Scissor.png">
            <p>Scissor</p>
        </div>
    </div>
    <div class="scoreBoard">
        <h2>Scoreboard</h2>
        <div class="score">
        <div class="You">
            <h3>You</h3>
            <p>1</p>
        </div>
        <div class="comp">
            <h3>Comp</h3>
            <p>4</p>
        </div>
        <div class="draw">
            <h3>Draws</h3>
            <p>5</p>
        </div>
        </div>
    </div>
    <div class="Message">
        <p>You are Losing</p>
    </div>

</body>
</html>
